repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
