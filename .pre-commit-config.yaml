# Uses the black/ruff installed in the environment (see requirements/dev.txt)
# rather than pinning a second set of versions here — keeps pre-commit, CI,
# and `make lint`/`make format` on exactly the same tool versions.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
