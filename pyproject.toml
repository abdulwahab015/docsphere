[tool.black]
line-length = 88
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "C4", "DJ", "SIM", "UP", "S", "RUF"]
ignore = [
    "E501",
    "RUF012",
    "DJ001",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "organizations", "projects", "subscriptions", "users"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101", "S105", "S106"]
"**/factories.py" = ["S105", "S106"]
"core/settings/*" = ["F401", "F403", "F405"]
"subscriptions/apps.py" = ["F401"]
