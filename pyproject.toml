[tool.black]
line-length = 88
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    "venv",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort
select = ["E", "F", "I"]
# E501 (line too long) is left to black; black doesn't split string
# literals, so a long single token (e.g. an import path) can still
# legally exceed line-length after black formats it.
ignore = ["E501"]