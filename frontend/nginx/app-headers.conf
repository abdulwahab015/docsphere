# Headers for the app's own files. Included in each location that serves them:
# an add_header inside a location drops every add_header from outside it.
# Django's responses carry its own security headers instead.

# Everything the app loads comes from this origin. Radix and sonner set inline
# style attributes, hence 'unsafe-inline' for styles only - scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
