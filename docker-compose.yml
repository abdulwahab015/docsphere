services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docsphere
      POSTGRES_USER: docsphere
      POSTGRES_PASSWORD: docsphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://docsphere:docsphere@db:5432/docsphere
    depends_on:
      - db

volumes:
  postgres_data:
