# Weekly pull requests into develop that update dependencies: one per
# ecosystem for minor and patch updates, one per major update. Security
# updates come as soon as an advisory is published (enable "Dependabot
# security updates" in the repository's settings).
version: 2

updates:
  # requirements/*.in, recompiled into the .txt files with pip-compile.
  - package-ecosystem: pip
    directory: /requirements
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript only supports TypeScript 5 so far.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # The images' base images.
  - package-ecosystem: docker
    directories: [/, /frontend]
    target-branch: develop
    schedule:
      interval: weekly

  # postgres and redis in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
