# Weekly pull requests into develop that update dependencies: one per
# ecosystem for minor and patch updates, one per major update. Security
# updates come as soon as an advisory is published (enable "Dependabot
# security updates" in the repository's settings).
version: 2

updates:
  # requirements/*.in, recompiled into the .txt files with pip-compile.
  - package-ecosystem: pip
    directory: /requirements
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript only supports TypeScript 5 so far.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's types follow the Node version we run (frontend/.nvmrc), not
      # the newest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Vitest (an optional peer) still requires MSW 2, and MSW 3 lets jsdom
      # make real CORS requests to the test API, which needs the test setup
      # reworked. Revisit once Vitest's peer range allows 3.
      - dependency-name: msw
        update-types: [version-update:semver-major]
      # jsdom 30 made the unit tests about a quarter slower, enough for tests
      # that wait on several requests to miss their 3s wait under load.
      # Revisit with a later release.
      - dependency-name: jsdom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # The images' base images. A new Python or Node release is an upgrade made
  # on purpose, together with CI's python-version and frontend/.nvmrc - not a
  # routine bump. (python:3.12-slim has no patch number, so a "minor" update
  # is a new Python release; patches arrive by rebuilding the same tag.)
  - package-ecosystem: docker
    directories: [/, /frontend]
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  # postgres and redis in docker-compose.yml. A new major release is an
  # upgrade made on purpose: Postgres can't open an older major's data files
  # (it needs pg_upgrade or a dump and restore, with CI's service moved too).
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
