name: Release

# Every merge to main is a release: both images are built and published to
# GitHub's container registry, tagged with the commit, then deployed to
# staging and - once someone approves the production environment - to
# production, the same images. Pull requests into main build the images
# without publishing them.
#
# Publishing and deploying are off until the repository variable
# DEPLOY_ENABLED is "true" (once the servers exist - README "Setting up a
# server"); until then a merge to main only checks that both images build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true' }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: backend
            context: .
          - image: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lower case; an owner's name may not be.
      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docsphere-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Error reports name the commit they happened in.
          build-args: RELEASE=${{ github.sha }}
          # The source label links the package to this repository, so the
          # repository's workflows may pull it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  staging:
    needs: images
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ github.sha }}
    secrets: inherit

  # Waits for a reviewer's approval (the production environment's protection
  # rule) before deploying what staging has been checked with.
  production:
    needs: staging
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ github.sha }}
    secrets: inherit
