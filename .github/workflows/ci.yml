name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Dummy-but-valid backend settings, shared by every job that runs Django.
env:
  DJANGO_SETTINGS_MODULE: core.settings.test
  SECRET_KEY: ci-test-secret-key-not-for-production
  ALLOWED_HOSTS: localhost
  ACCESS_TOKEN_LIFETIME_SECONDS: "900"
  REFRESH_TOKEN_LIFETIME_SECONDS: "604800"
  INVITATION_EXPIRY_SECONDS: "604800"
  SUBSCRIPTION_EXPIRY_REMINDER_DAYS: "7"
  ANON_THROTTLE_RATE: "100000/min"
  USER_THROTTLE_RATE: "100000/min"
  LOGIN_THROTTLE_RATE: "100000/min"
  INVITE_ACCEPT_THROTTLE_RATE: "100000/min"
  PASSWORD_RESET_THROTTLE_RATE: "100000/min"
  BILLING_CHECKOUT_THROTTLE_RATE: "100000/min"
  BILLING_PORTAL_THROTTLE_RATE: "100000/min"
  ORG_SIGNUP_THROTTLE_RATE: "100000/min"
  PASSWORD_CHANGE_THROTTLE_RATE: "100000/min"
  DJSTRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend API types match the backend schema
        run: make fe-api-types-check

      - name: black
        run: black --check .

      - name: ruff
        run: ruff check .

      - name: Test suite
        run: coverage run manage.py test

      - name: Coverage report (fails under threshold)
        run: coverage report

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: prettier
        run: npm run format:check

      - name: oxlint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test suite (fails under coverage threshold)
        run: npm run test:cov

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements/dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real API + production build)
        run: make fe-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
